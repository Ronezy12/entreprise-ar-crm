<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F3FB8">
<title>Entreprise AR — CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Poppins:wght@400;500;600;700&display=swap">
<link rel="icon" href="logo.jpg" type="image/jpeg">
<link rel="manifest" href="manifest.json">
<style>
/* =====================================================================
   Entreprise AR — CRM
   Design : bleu roi + jaune, Montserrat (titres) + Poppins (texte).
   Layout : sidebar à gauche (desktop), barre inférieure (mobile).
   Pages  : dashboard, visites, visite (wizard), clients, techniciens, paramètres.
   ===================================================================== */
:root{
  --bg:#F3F5FB; --surface:#FFFFFF; --surface-2:#F8FAFF; --ink:#0E1630; --muted:#4A5370; --line:#D3D9EA;
  --royal:#1F3FB8; --royal-ink:#FFFFFF; --royal-soft:#E3E9FB; --royal-dark:#162E8F;
  --yellow:#F5C400; --yellow-ink:#141400; --yellow-soft:#FDF5CE;
  --ok:#0B7A52; --ok-soft:#E1F4EC; --warn:#9A4A00; --warn-soft:#FDF0DC;
  --bad:#B42318; --bad-soft:#FDE7E4;
  --f-display:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px; --r-sm:10px; --tap:52px;
  --sb-w:260px;
  --shadow-sm:0 1px 3px rgba(14,22,48,.08);
  --shadow-md:0 4px 20px rgba(14,22,48,.1);
  --shadow-lg:0 12px 32px rgba(14,22,48,.12);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A0F22; --surface:#131A33; --surface-2:#1A2240; --ink:#EEF1FA; --muted:#A9B1CE; --line:#2A3354;
  --royal:#7E95FF; --royal-ink:#0A0F22; --royal-soft:#1B2550; --royal-dark:#5C76E8;
  --yellow:#FFD234; --yellow-ink:#141400; --yellow-soft:#3A3414;
  --ok:#46D29A; --ok-soft:#0F2E24; --warn:#F5B35C; --warn-soft:#33240E; --bad:#FF8577; --bad-soft:#3A1814;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A0F22; --surface:#131A33; --surface-2:#1A2240; --ink:#EEF1FA; --muted:#A9B1CE; --line:#2A3354;
  --royal:#7E95FF; --royal-ink:#0A0F22; --royal-soft:#1B2550; --royal-dark:#5C76E8;
  --yellow:#FFD234; --yellow-ink:#141400; --yellow-soft:#3A3414;
  --ok:#46D29A; --ok-soft:#0F2E24; --warn:#F5B35C; --warn-soft:#33240E; --bad:#FF8577; --bad-soft:#3A1814;
  color-scheme:dark}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
img{max-width:100%;display:block}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px;border-radius:6px}
a{color:var(--royal);text-decoration:none}
a:hover{text-decoration:underline}

/* ===== Login & plein écran ===== */
.screen{min-height:100dvh;display:grid;place-items:center;padding:24px;padding-left:max(24px,env(safe-area-inset-left));padding-right:max(24px,env(safe-area-inset-right))}
.login{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:32px 28px;box-shadow:var(--shadow-md);display:flex;flex-direction:column;gap:20px}
.login-logo{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:4px}
.login-logo img{width:88px;height:88px;object-fit:contain;border-radius:14px}
.login h1{font-family:var(--f-display);font-weight:800;font-size:24px;text-align:center}
.login .sub{text-align:center;color:var(--muted);font-size:14px;margin-top:-14px}
.err{background:var(--bad-soft);color:var(--bad);padding:10px 12px;border-radius:var(--r-sm);font-size:14px;font-weight:500}
.ok-msg{background:var(--ok-soft);color:var(--ok);padding:10px 12px;border-radius:var(--r-sm);font-size:14px;font-weight:500}
.linkbtn{background:transparent;border:0;color:var(--royal);font-weight:600;cursor:pointer;padding:8px;font-size:14px;text-align:center}
.linkbtn:hover{text-decoration:underline}

/* ===== Formulaires ===== */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field label .req{color:var(--bad)}
.field .opt{color:var(--muted);font-weight:400}
input[type=text],input[type=email],input[type=tel],input[type=password],input[type=date],input[type=number],input[type=search],textarea,select{
  width:100%;min-height:var(--tap);border:2px solid var(--line);border-radius:var(--r-sm);background:var(--bg);padding:10px 12px;font-size:15px;transition:border-color .15s}
textarea{min-height:96px;resize:vertical}
input:focus,textarea:focus,select:focus{border-color:var(--royal);outline:none}
input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--yellow);outline-offset:1px}
input[disabled],textarea[disabled],select[disabled]{opacity:.6;cursor:not-allowed}

/* ===== Boutons ===== */
.btn{min-height:var(--tap);border:0;border-radius:var(--r-sm);padding:0 18px;font-weight:700;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--royal);color:var(--royal-ink);transition:background .15s,transform .08s,box-shadow .15s;text-decoration:none}
.btn:hover{background:var(--royal-dark);text-decoration:none}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--yellow);color:var(--yellow-ink)}
.btn.primary:hover{background:#DBAF00}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.ghost:hover{background:var(--surface-2);border-color:var(--royal)}
.btn.danger{background:transparent;color:var(--bad);border:2px solid var(--line)}
.btn.danger:hover{background:var(--bad-soft);border-color:var(--bad)}
.btn.danger-filled{background:var(--bad);color:#fff}
.btn.sm{min-height:40px;font-size:14px;padding:0 14px}
.btn.full{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn-group{display:flex;gap:8px;flex-wrap:wrap}

/* ===== Shell (sidebar + contenu) ===== */
.shell{min-height:100dvh;display:grid;grid-template-columns:var(--sb-w) 1fr;gap:0}
.sidebar{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 14px;padding-left:max(14px,env(safe-area-inset-left));position:sticky;top:0;height:100dvh;overflow-y:auto}
.sb-logo{display:flex;align-items:center;gap:10px;padding:4px 10px 18px;border-bottom:1px solid var(--line);margin-bottom:12px}
.sb-logo img{width:40px;height:40px;object-fit:contain;border-radius:8px}
.sb-logo .t{min-width:0}
.sb-logo small{display:block;font-family:var(--f-display);font-weight:800;letter-spacing:.1em;font-size:11px;color:var(--muted);line-height:1.1}
.sb-logo small b{color:var(--yellow)}
.sb-logo strong{display:block;font-family:var(--f-display);font-weight:700;font-size:16px;color:var(--ink);line-height:1.1}
.nav{display:flex;flex-direction:column;gap:3px;flex:1}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:var(--r-sm);color:var(--muted);font-weight:600;font-size:15px;min-height:48px}
.nav a:hover{background:var(--surface-2);color:var(--ink);text-decoration:none}
.nav a.active{background:var(--royal);color:var(--royal-ink)}
.nav a.active:hover{background:var(--royal-dark)}
.nav a .ic{width:22px;height:22px;flex:none;display:inline-flex;align-items:center;justify-content:center}
.nav .sep{height:1px;background:var(--line);margin:10px 10px}
.nav .label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:6px 14px}
.sb-user{padding:12px 10px 4px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--royal);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;font-family:var(--f-display);flex:none}
.sb-user .nm{min-width:0;flex:1}
.sb-user .nm b{display:block;font-size:14px;font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-user .nm span{display:block;font-size:12px;color:var(--muted)}

.main{min-width:0;display:flex;flex-direction:column}
.sb-backdrop{display:none}
.topbar{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line);padding:14px 24px;padding-left:max(24px,env(safe-area-inset-left));padding-right:max(24px,env(safe-area-inset-right));display:flex;align-items:center;gap:12px;min-height:64px}
.topbar h1{font-family:var(--f-display);font-weight:700;font-size:22px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar .back{display:inline-flex;align-items:center;gap:4px;padding:8px 12px;border-radius:var(--r-sm);color:var(--muted);font-weight:600;cursor:pointer;background:transparent;border:0}
.topbar .back:hover{background:var(--surface-2);color:var(--ink)}
.content{padding:24px;padding-left:max(24px,env(safe-area-inset-left));padding-right:max(24px,env(safe-area-inset-right));padding-bottom:120px;max-width:1200px;width:100%;flex:1}

/* Mobile nav */
.menu-btn{display:none;min-width:48px;height:48px;border:0;background:transparent;cursor:pointer;align-items:center;justify-content:center;border-radius:var(--r-sm);color:var(--ink)}
.menu-btn svg{width:24px;height:24px}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .sidebar{display:none;position:fixed;top:0;left:0;height:100dvh;width:280px;z-index:50;box-shadow:var(--shadow-lg)}
  .sidebar.open{display:flex}
  .sb-backdrop{display:none;position:fixed;inset:0;background:rgba(10,15,34,.5);z-index:40}
  .sb-backdrop.show{display:block}
  .menu-btn{display:inline-flex}
  .topbar{padding:12px 16px;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
  .content{padding:16px;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right));padding-bottom:100px}
}

/* ===== Dashboard ===== */
.greet{font-family:var(--f-display);font-weight:700;font-size:clamp(22px,4vw,30px);margin-bottom:4px}
.greet-sub{color:var(--muted);margin-bottom:24px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:28px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:4px;box-shadow:var(--shadow-sm)}
.kpi .l{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.kpi .n{font-family:var(--f-display);font-weight:800;font-size:36px;color:var(--ink);line-height:1}
.kpi.hl{background:var(--yellow-soft);border-color:transparent}
.kpi.hl .n{color:var(--yellow-ink)}
.kpi .d{font-size:13px;color:var(--muted);margin-top:4px}
.section-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:28px 0 14px;flex-wrap:wrap}
.section-h h2{font-family:var(--f-display);font-weight:700;font-size:20px}
.actions{display:flex;gap:10px;flex-wrap:wrap}

/* ===== Listes & cartes ===== */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.toolbar .search{flex:1;min-width:200px}
.filters{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:3px;flex-wrap:wrap}
.filters button{min-height:44px;border:0;border-radius:8px;background:transparent;font-weight:600;color:var(--muted);cursor:pointer;padding:0 14px;font-size:14px;display:flex;align-items:center;gap:6px}
.filters button[aria-selected=true]{background:var(--royal);color:var(--royal-ink)}
.filters .c{font-size:12px;opacity:.85;padding:2px 6px;background:rgba(255,255,255,.2);border-radius:999px}
.filters button:not([aria-selected=true]) .c{background:var(--surface-2);color:var(--muted);opacity:1}

.list{display:flex;flex-direction:column;gap:10px}
.row-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 20px;display:grid;grid-template-columns:1fr auto;gap:4px 16px;cursor:pointer;transition:border-color .15s,box-shadow .15s;color:inherit;text-decoration:none}
.row-card:hover{border-color:var(--royal);box-shadow:var(--shadow-sm);text-decoration:none}
.row-card .ttl{font-family:var(--f-display);font-weight:700;font-size:18px;line-height:1.2;overflow-wrap:anywhere}
.row-card .meta{grid-column:1/-1;color:var(--muted);font-size:14px;display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:2px}
.row-card .meta b{color:var(--ink);font-weight:600}
.row-card .pill{align-self:start}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
.pill .d{width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.brouillon{background:var(--royal-soft);color:var(--royal)}
.pill.envoye{background:var(--warn-soft);color:var(--warn)}
.pill.devis_fait{background:var(--ok-soft);color:var(--ok)}
.pill.active{background:var(--ok-soft);color:var(--ok)}
.pill.inactive{background:var(--surface-2);color:var(--muted)}
.pill.admin{background:var(--yellow-soft);color:var(--yellow-ink)}
.pill.technicien{background:var(--royal-soft);color:var(--royal)}
.pill.dot-alert{background:var(--bad-soft);color:var(--bad)}

.empty{background:var(--surface);border:2px dashed var(--line);border-radius:var(--r);padding:36px 24px;text-align:center}
.empty h3{font-family:var(--f-display);font-size:20px;margin-bottom:6px}
.empty p{color:var(--muted);max-width:460px;margin:0 auto 16px}
.loading{text-align:center;color:var(--muted);padding:40px}

/* ===== Wizard / blocs ===== */
.block{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px;margin-bottom:14px}
.block>h2{font-family:var(--f-display);font-weight:700;font-size:18px;display:flex;align-items:center;gap:8px}
.block>h2 .tag{margin-left:auto;font-family:var(--f-body);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.q{display:flex;flex-direction:column;gap:8px}
.q>.ql{font-weight:600;font-size:15px}
.q>.ql .opt{font-weight:400;color:var(--muted);font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:8px 16px;border-radius:999px;border:2px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;cursor:pointer;color:var(--ink);transition:background .12s,border-color .12s,transform .08s}
.chip:hover{border-color:var(--royal)}
.chip:active{transform:scale(.97)}
.chip[aria-pressed=true]{background:var(--royal);border-color:var(--royal);color:var(--royal-ink)}

.steps{background:var(--surface);border-bottom:1px solid var(--line);padding:0 24px}
.steps ol{list-style:none;display:flex;gap:4px;overflow-x:auto}
.steps li{flex:1;min-width:0}
.steps button{width:100%;border:0;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 4px;min-height:60px;color:var(--muted)}
.steps .n{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;border:2px solid var(--line);background:var(--surface)}
.steps .lb{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps button.done .n{background:var(--royal-soft);border-color:var(--royal);color:var(--royal)}
.steps button[aria-current=step]{color:var(--ink)}
.steps button[aria-current=step] .n{background:var(--yellow);border-color:var(--yellow);color:var(--yellow-ink)}
@media (max-width:600px){.steps{padding:0 10px}.steps .lb{display:none}.steps button[aria-current=step] .lb{display:block}}

/* Steppers numériques */
.row-fld{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.row-fld:first-of-type{border-top:0}
.row-fld.on{background:linear-gradient(to right,var(--royal-soft),transparent);margin:0 -10px;padding:10px}
.row-fld .fl{flex:1 1 160px;min-width:0;font-weight:500}
.row-fld.on .fl{font-weight:600;color:var(--royal)}
.stepper{display:flex;align-items:center;border:2px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--bg)}
.row-fld.on .stepper{border-color:var(--royal)}
.stepper button{width:48px;height:48px;border:0;background:transparent;font-size:24px;font-weight:600;cursor:pointer;color:var(--ink)}
.stepper button:active{background:var(--royal-soft)}
.stepper input{width:56px;min-height:0;height:48px;border:0;border-radius:0;background:transparent;text-align:center;font-weight:700;font-size:18px;padding:0;-moz-appearance:textfield}
.stepper input::-webkit-inner-spin-button,.stepper input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.stepper .u{font-size:13px;color:var(--muted);padding-right:10px;font-weight:600}

.group-t{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:8px 0 2px}

/* Pièces */
.room{border:2px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden;margin-bottom:10px}
.room.open{border-color:var(--royal)}
.room-h{width:100%;display:flex;align-items:center;gap:12px;padding:14px 18px;border:0;background:transparent;cursor:pointer;text-align:left;min-height:64px}
.room-h .nm{font-family:var(--f-display);font-weight:700;font-size:18px;flex:1;min-width:0;overflow-wrap:anywhere}
.room-h .ct{font-size:13px;color:var(--muted);white-space:nowrap}
.room-h .ct b{color:var(--ink);font-weight:600}
.chev{width:10px;height:10px;border-right:3px solid var(--muted);border-bottom:3px solid var(--muted);transform:rotate(45deg);flex:none;transition:transform .15s;margin-bottom:4px}
.room.open .chev{transform:rotate(-135deg);margin:4px 0 0}
.room-b{border-top:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:14px}

/* Guide photo */
.guide{display:grid;grid-template-columns:minmax(0,200px) 1fr;gap:16px;align-items:center;background:var(--royal-soft);border-radius:var(--r);padding:14px 16px}
.guide svg{width:100%;max-width:220px;height:auto;justify-self:center}
.guide-t{font-family:var(--f-display);font-weight:700;font-size:15px;color:var(--royal);margin-bottom:6px}
.guide-l{padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.g-frame{stroke:var(--yellow);stroke-width:4;fill:none}
.g-door{fill:var(--line);stroke:var(--muted);stroke-width:1.5}
.g-enc{fill:var(--surface);stroke:var(--ink);stroke-width:2.5}
.g-rail{fill:var(--line)}
.g-id{fill:var(--royal)}
.g-mod{fill:var(--bg);stroke:var(--muted);stroke-width:1}
.g-tog{fill:var(--ink)}
.g-lab{fill:var(--yellow)}
.g-call circle{fill:var(--yellow)}
.g-call text{fill:var(--yellow-ink);font:700 13px var(--f-body);text-anchor:middle;dominant-baseline:central}
@media (max-width:520px){.guide{grid-template-columns:1fr}}

/* Photos */
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.pick{grid-template-columns:1fr}}
.shoot{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;min-height:72px;border:2px dashed var(--royal);border-radius:var(--r);background:var(--royal-soft);color:var(--royal);font-weight:700;font-size:16px;cursor:pointer;padding:12px}
.shoot.alt{border-color:var(--line);background:var(--surface);color:var(--ink)}
.shoot input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.preview{display:flex;flex-direction:column;gap:10px}
.pv-img{position:relative;border-radius:var(--r);overflow:hidden;background:#000;max-width:100%}
.pv-img img{width:100%;max-height:60vh;object-fit:contain}
.pv-img .ov{position:absolute;inset:0;width:100%;height:100%}
.ov-c{stroke:#FFD234;stroke-width:4;fill:none;stroke-linecap:round}
.ov-t{stroke:#FFD234;stroke-width:1.5;stroke-dasharray:5 4;opacity:.85;fill:none;vector-effect:non-scaling-stroke}
.pv-frame{position:absolute;inset:6%;border:3px dashed #FFD234;border-radius:8px}
.pv-img .cap{position:absolute;left:0;right:0;bottom:0;padding:10px 14px;background:rgba(10,15,34,.8);color:#fff;font-size:14px;display:flex;flex-direction:column;gap:2px}
.pv-img .cap span{color:#FFD234;font-weight:600}
.pv-act{display:flex;gap:10px}
.pv-act .btn{flex:1}

.ph-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.ph{display:flex;flex-direction:column;gap:6px}
.ph-img{position:relative;border-radius:var(--r-sm);overflow:hidden;background:var(--bg);border:1px solid var(--line);aspect-ratio:1}
.ph-img img{width:100%;height:100%;object-fit:cover}
.ph-img .cap{position:absolute;left:0;right:0;bottom:0;padding:6px 10px;background:rgba(10,15,34,.8);color:#fff;font-size:12px;display:flex;flex-direction:column;line-height:1.3}
.ph-img .cap b{font-weight:600}
.ph-img .cap span{color:#FFD234;font-weight:600}
.ph-img .del{position:absolute;top:6px;right:6px;width:38px;height:38px;border-radius:50%;border:0;background:rgba(10,15,34,.8);color:#fff;font-size:20px;cursor:pointer}
.ph figcaption input{min-height:40px;font-size:13px;padding:7px 10px}
.ph-doc{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;height:100%;color:var(--royal);font-weight:700;font-size:14px}
.ph-doc span{font-size:40px}

.todo-ph{display:flex;flex-wrap:wrap;gap:8px}
.todo-ph span{font-size:13px;padding:5px 11px;border-radius:999px;background:var(--warn-soft);color:var(--warn);font-weight:600}
.todo-ph span.ok{background:var(--ok-soft);color:var(--ok)}

/* Notices */
.notice{border-radius:var(--r);padding:14px 18px;display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.notice h3{font-family:var(--f-display);font-size:17px;display:flex;gap:8px;align-items:center}
.notice ul{padding-left:22px;display:flex;flex-direction:column;gap:4px}
.notice.bad{background:var(--bad-soft);color:var(--bad)}
.notice.bad li{color:var(--ink)}
.notice.warn{background:var(--warn-soft);color:var(--warn)}
.notice.warn li{color:var(--ink)}
.notice.ok{background:var(--ok-soft);color:var(--ok)}
.fix{border:0;background:transparent;color:var(--royal);font-weight:700;text-decoration:underline;cursor:pointer;padding:2px}

/* Clé-valeur */
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 20px}
dl.kv dt{color:var(--muted);font-weight:500}
dl.kv dd{overflow-wrap:anywhere;font-weight:600}

/* Table */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;min-width:600px;font-size:14px}
th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--surface-2);font-weight:700}
td.n{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.ref{font-size:13px}
.ref.todo{color:var(--muted);font-style:italic}

/* Dock bas (actions wizard) */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(14,22,48,.08);padding-bottom:env(safe-area-inset-bottom)}
.dock-in{max-width:1200px;margin:0 auto;display:flex;gap:10px;padding:12px 24px;padding-left:max(24px,calc(var(--sb-w) + 24px));padding-right:max(24px,env(safe-area-inset-right));align-items:center}
@media (max-width:900px){.dock-in{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}}
.dock-in .st{flex:1;font-size:13px;color:var(--muted);min-width:120px;display:flex;align-items:center;gap:6px}
.st.ok{color:var(--ok)}.st.err{color:var(--bad)}.st.pending{color:var(--warn)}
.st .d{width:9px;height:9px;border-radius:50%;background:currentColor}

/* Modales */
.modal{position:fixed;inset:0;z-index:60;background:rgba(10,15,34,.6);display:grid;place-items:center;padding:16px}
.modal-box{background:var(--surface);border-radius:var(--r);padding:24px;max-width:460px;width:100%;max-height:90dvh;overflow-y:auto;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;gap:16px}
.modal-box h2{font-family:var(--f-display);font-size:20px}
.modal-box .msg{color:var(--muted);font-size:14px}

/* Toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:120px;z-index:80;background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:12px;font-weight:600;max-width:calc(100% - 32px);box-shadow:var(--shadow-lg);font-size:14px}
.toast.err{background:var(--bad);color:#fff}
.toast.ok{background:var(--ok);color:#fff}

/* Offline bandeau */
.offline-bar{background:var(--warn-soft);color:var(--warn);font-size:14px;font-weight:600;padding:8px 24px;text-align:center}

/* Utilitaires */
.muted{color:var(--muted)}
.small{font-size:13px}
.center{text-align:center}
.spaced{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.hidden{display:none !important}
.sep{height:1px;background:var(--line);margin:14px 0}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>

<script type="module">
/* =====================================================================

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

   Console Firebase → Paramètres du projet → Vos applications → Config */
const firebaseConfig = {

/* =====================================================================
   Vocabulaire métier (électricien NF C 15-100 / Legrand)
   ===================================================================== */
const ON = ["Oui", "Non"];
const ROOMS = ["Séjour","Cuisine","Chambre","Salle de bain","WC","Entrée","Couloir","Bureau","Buanderie","Garage","Cave","Extérieur"];
const POSTES = [
  {g:"Prises", items:[
    {k:"pc", l:"PC 16 A à créer", u:"u", app:1},
    {k:"pcR", l:"PC 16 A à remplacer", u:"u", app:1},
    {k:"spe", l:"Circuit spé (lave-linge, four…)", u:"u"},
    {k:"p32", l:"Circuit plaque 32 A", u:"u"},
    {k:"rj45", l:"Prise RJ45", u:"u", app:1},
    {k:"tv", l:"Prise TV", u:"u", app:1},
    {k:"plexo", l:"Prise étanche (Plexo)", u:"u", gamme:"Plexo"}
  ]},
  {g:"Éclairage & commandes", items:[
    {k:"dcl", l:"Point DCL à créer", u:"u", gamme:"Batibox + DCL"},
    {k:"dclR", l:"Point lumineux à remplacer", u:"u"},
    {k:"spots", l:"Spots encastrés", u:"u"},
    {k:"inter", l:"Inter simple allumage", u:"u", app:1},
    {k:"vv", l:"Va-et-vient", u:"u", app:1},
    {k:"bp", l:"Bouton poussoir (TR)", u:"u", app:1},
    {k:"tr", l:"Télérupteur", u:"u"},
    {k:"detect", l:"Détecteur de mouvement", u:"u"}
  ]},
  {g:"Cheminement", items:[
    {k:"goulotte", l:"Goulotte / moulure", u:"m", pose:"Apparent", gamme:"DLP"},
    {k:"saignee", l:"Saignée", u:"m", pose:"Encastré"},
    {k:"cable", l:"Tirage de câble", u:"m"}
  ]},
  {g:"Équipements", items:[
    {k:"rad", l:"Radiateur", u:"u"},
    {k:"seche", l:"Sèche-serviettes", u:"u"},
    {k:"vmc", l:"VMC (bouche ou circuit)", u:"u"},
    {k:"daaf", l:"Détecteur de fumée", u:"u"},
    {k:"borne", l:"Borne Green'up Home", u:"u", gamme:"Green'up Home", ref:"LEG057002"},
    {k:"gu", l:"Prise Green'up", u:"u", gamme:"Green'up Access", ref:"LEG090476"}
  ]}
];
const P = {}; POSTES.forEach(g => g.items.forEach(i => P[i.k] = i));
const DEFAUTS = ["Fils nus / dominos apparents","Repiquages","Boîtes de dérivation non accessibles","Câbles sous gaine tissu","Sections de câble insuffisantes","Tableau sans capot ou non fixé","Prises sans terre"];
const STEPS = [{k:"client",l:"Client"},{k:"existant",l:"Existant"},{k:"travaux",l:"Travaux"},{k:"photos",l:"Photos"},{k:"recap",l:"Récap"}];
const STATUS = {brouillon:"Brouillon", envoye:"Envoyée au bureau", devis_fait:"Devis fait"};
const MOTIFS = {
  "Tableau":["Vue d'ensemble capot ouvert","Étiquettes / calibres","Disjo brûlé ou qui chauffe","Pas de 30 mA","Fusibles porcelaine","Fils nus / dominos","Place disponible (rangées)"],
  "Compteur / AGCP":["Vue d'ensemble","Calibre AGCP lisible","Plaque / index du compteur"],
  "Terre / barrette":["Barrette de terre","Câble / piquet de terre","Pas de terre visible"],
  "*":["Vue d'ensemble","Défaut constaté","Emplacement prévu","Passage de câble","Mur / support"]
};

/* =====================================================================
   État global
   ===================================================================== */
const S = {
  user: null,
  profile: null,
  isAdmin: false,
  route: "",
  visites: [], clients: [], techs: [],
  loading: {visites:true, clients:true, techs:true},
  // wizard
  v: null, step: 0, openRoom: null, confirm: null,
  phTag: "Tableau", phMotif: "", pending: null, uploading: false, save: "ok",
  // navigation mobile
  sbOpen: false,
  // UI
  modal: null, techForm: null, techMsg: null,
  online: navigator.onLine
};
let unsubs = [];
let saveT = null, saving = false, again = false;

/* =====================================================================
   Utilitaires
   ===================================================================== */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today = () => { const d = new Date(), p = n => String(n).padStart(2,"0"); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`; };
const fmtDay = s => { if (!s) return "—"; const d = new Date(s + "T12:00:00"); return isNaN(d) ? "—" : d.toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"short"}); };
const fmtDate = s => { if (!s) return "—"; const d = new Date(s); return isNaN(d) ? "—" : d.toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit",year:"numeric"}); };
const fmtNum = v => String(v).replace(".",",");
const filled = v => v != null && v !== "" && v !== 0 && !(Array.isArray(v) && !v.length);
const uid = () => Math.random().toString(36).slice(2,10);
const randPass = () => Array.from(crypto.getRandomValues(new Uint8Array(10))).map(b => "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"[b % 32]).join("");
const toast = (t, cls="") => { const el = $("toast"); el.className = "toast " + cls; el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, 2800); };
const initials = (name) => (name || "?").split(/\s+/).map(w => w[0]).filter(Boolean).slice(0,2).join("").toUpperCase();

/* =====================================================================
   Logique métier
   ===================================================================== */
function blankVisite(){
  return {
    client: {nom:"",adresse:"",tel:"",devis:"",date:today(),logement:"",annee:"",etage:"",occupe:""},
    existant: {compteur:"",phase:"",kva:"",agcp:"",tabAction:"",rangees:"",protection:"",id30:"",idAC:0,idA:0,idF:0,dj:0,parafoudre:"",hc:"",gtl:"",etel:"",terre:"",ohms:"",barrette:"",lep:"",defauts:[],note:""},
    gamme:"", pieces: [], photos: [], status: "brouillon"
  };
}
function normalizeVisite(d){
  const b = blankVisite();
  return {
    ...b, ...d,
    client: {...b.client, ...(d.client||{})},
    existant: {...b.existant, ...(d.existant||{})},
    gamme: d.gamme || "",
    pieces: (d.pieces||[]).map(p => ({id:p.id||uid(),nom:p.nom||"Pièce",pose:p.pose||"",mur:p.mur||"",hsp:p.hsp||"",postes:{...(p.postes||{})},note:p.note||""})),
    photos: d.photos || [],
    status: d.status || "brouillon"
  };
}
function roomTotal(p){ let n = 0; for (const k in p.postes) if (P[k] && p.postes[k] > 0) n++; return n; }

function lignes(v){
  const L = [], e = v.existant, G = v.gamme || "";
  const push = (poste,qte,unite,pose,piece,gamme,ref) => L.push({poste,qte,unite,pose:pose||"—",piece,gamme:gamme||"—",ref:ref||"réf. à vérifier sur Rexel"});
  if (e.tabAction === "Remplacer" || e.tabAction === "Compléter"){
    if (e.tabAction === "Remplacer") push("Coffret de répartition"+(e.rangees?" "+e.rangees:""),1,"u","—","Tableau","Drivia");
    if (e.idAC > 0) push("Inter. différentiel 30 mA type AC", e.idAC, "u", "—", "Tableau", "Legrand");
    if (e.idA > 0) push("Inter. différentiel 30 mA type A", e.idA, "u", "—", "Tableau", "Legrand");
    if (e.idF > 0) push("Inter. différentiel 30 mA type F", e.idF, "u", "—", "Tableau", "Legrand");
    if (e.dj > 0) push("Disjoncteur divisionnaire", e.dj, "u", "—", "Tableau", "DX³ / DNX³");
    if (e.parafoudre === "Oui") push("Parafoudre", 1, "u", "—", "Tableau", "Legrand");
    if (e.hc === "Oui") push("Contacteur heures creuses", 1, "u", "—", "Tableau", "Legrand");
  }
  if (e.gtl === "Non") push("GTL à créer", 1, "u", "—", "Entrée", "Legrand");
  if (e.etel === "Oui") push("Tableau de communication (ETEL)", 1, "u", "—", "Tableau", "Drivia");
  if (e.barrette === "Oui") push("Barrette de terre / mise à la terre", 1, "u", "—", "Tableau", "—", "—");
  if (e.lep === "Oui") push("Liaison équipotentielle principale", 1, "u", "—", "Tableau", "—", "—");
  for (const p of v.pieces){
    const ext = /extérieur|garage|cave/i.test(p.nom);
    for (const g of POSTES) for (const it of g.items){
      const q = p.postes[it.k]; if (!(q > 0)) continue;
      const gamme = it.gamme || (it.app ? (ext ? "Plexo" : G) : "");
      push(it.l, q, it.u, it.pose || p.pose, p.nom, gamme, it.ref || (gamme ? undefined : "—"));
    }
  }
  return L;
}
function alertes(v){
  const e = v.existant, A = [];
  if (e.id30 === "Non") A.push("Pas de protection différentielle 30 mA.");
  if (e.protection === "Fusibles porcelaine") A.push("Fusibles porcelaine : remplacement du tableau à prévoir.");
  if (e.terre === "Absente") A.push("Pas de prise de terre.");
  if (e.terre === "Inconnue") A.push("Prise de terre non vérifiée.");
  if (e.ohms !== "" && e.ohms != null) A.push(`Mesure de terre : ${fmtNum(e.ohms)} Ω, à comparer au seuil selon NF C 15-100 en vigueur.`);
  (e.defauts||[]).forEach(d => A.push(d + "."));
  if (v.pieces.some(p => /salle de bain/i.test(p.nom))) A.push("Salle de bain : volumes et LES à vérifier selon NF C 15-100 en vigueur.");
  if (v.pieces.some(p => p.postes.borne > 0 || p.postes.gu > 0)) A.push("Recharge VE : puissance souscrite et protection dédiée à vérifier.");
  if (e.tabAction === "Remplacer") A.push("Rénovation du tableau : Consuel éventuellement à prévoir. Disjoncteur de branchement = limite de prestation Enedis.");
  return A;
}
function manques(v){
  const c = v.client, e = v.existant, M = [];
  if (!c.nom.trim()) M.push({t:"Nom du client",s:0});
  if (!c.adresse.trim()) M.push({t:"Adresse du chantier",s:0});
  if (!c.logement) M.push({t:"Type de logement",s:0});
  if (!e.tabAction) M.push({t:"Que faire du tableau",s:1});
  if (e.tabAction === "Remplacer" && !e.rangees) M.push({t:"Nombre de rangées du nouveau tableau",s:1});
  if (!e.terre) M.push({t:"Présence de la prise de terre",s:1});
  if (!v.pieces.length) M.push({t:"Aucune pièce avec des travaux",s:2});
  for (const p of v.pieces){
    if (!roomTotal(p)) M.push({t:`${p.nom} : aucun poste saisi`,s:2,r:p.id});
    else {
      if (!p.pose) M.push({t:`${p.nom} : encastré ou apparent ?`,s:2,r:p.id});
      if ((p.pose === "Encastré" || p.pose === "Mixte" || p.postes.saignee > 0) && !p.mur) M.push({t:`${p.nom} : type de mur`,s:2,r:p.id});
      if ((p.postes.dcl > 0 || p.postes.spots > 0) && !p.hsp) M.push({t:`${p.nom} : hauteur sous plafond`,s:2,r:p.id});
    }
  }
  if (!v.gamme && v.pieces.some(p => POSTES.some(g => g.items.some(i => i.app && p.postes[i.k] > 0)))) M.push({t:"Gamme d'appareillage souhaitée",s:2});
  if (v.pieces.some(p => p.postes.borne > 0) && !e.kva) M.push({t:"Puissance souscrite (borne de recharge)",s:1});
  return M.filter((m,i,a) => a.findIndex(x => x.t === m.t) === i);
}
function photosAttendues(v){
  const tags = new Set(v.photos.map(p => p.tag));
  const out = [{t:"Tableau",ok:tags.has("Tableau")},{t:"Compteur / AGCP",ok:tags.has("Compteur / AGCP")}];
  v.pieces.filter(p => roomTotal(p)).forEach(p => out.push({t:p.nom,ok:tags.has(p.nom)}));
  return out;
}
function compteRendu(v){
  const c = v.client, e = v.existant, L = [];
  L.push("COMPTE RENDU DE VISITE — ENTREPRISE AR");
  L.push(`CLIENT / ADRESSE : ${c.nom||"—"} — ${c.adresse||"—"}${c.tel?" — "+c.tel:""}${c.devis?" — devis "+c.devis:""}`);
  L.push(`DATE DE VISITE : ${fmtDay(c.date)} — Technicien : ${techName(v.createdBy)}`);
  L.push(`TYPE DE LOGEMENT : ${c.logement||"—"} — ${c.annee||"année inconnue"}${c.etage?" — "+c.etage:""}${c.occupe?" — "+c.occupe.toLowerCase():""}`);
  const ex = [];
  ex.push(`tableau ${e.tabAction?e.tabAction.toLowerCase():"?"}${e.rangees?" ("+e.rangees+")":""}`);
  if (e.protection) ex.push(e.protection.toLowerCase());
  ex.push("ID 30 mA : "+(e.id30||"?").toLowerCase());
  ex.push("terre : "+(e.terre||"?").toLowerCase()+(e.ohms!==""&&e.ohms!=null?" ("+fmtNum(e.ohms)+" Ω)":""));
  if (e.compteur) ex.push("compteur "+e.compteur);
  if (e.phase) ex.push(e.phase.toLowerCase());
  if (e.kva) ex.push(e.kva);
  if (e.agcp) ex.push("AGCP "+e.agcp);
  L.push("ÉTAT EXISTANT : "+ex.join(", "));
  if (e.note) L.push("  Note : "+e.note);
  L.push("TRAVAUX DEMANDÉS :");
  const lg = lignes(v);
  if (!lg.length) L.push("  (aucun)");
  lg.forEach(l => L.push(`  - ${l.poste} | ${fmtNum(l.qte)} | ${l.unite} | ${l.pose} | ${l.piece} | ${l.gamme} | ${l.ref}`));
  v.pieces.forEach(p => { const d = [p.mur&&"mur "+p.mur.toLowerCase(), p.hsp&&"HSP "+p.hsp, p.note].filter(Boolean); if (d.length) L.push(`  · ${p.nom} : ${d.join(" — ")}`); });
  L.push("ALERTES SÉCURITÉ / NORME :"); const A = alertes(v); if (!A.length) L.push("  (aucune)"); A.forEach(a => L.push("  - "+a));
  L.push("INFOS MANQUANTES POUR CHIFFRER :"); const M = manques(v); if (!M.length) L.push("  (aucune)"); M.forEach(m => L.push("  - "+m.t));
  L.push("PHOTOS ET DOCUMENTS JOINTS :"); if (!v.photos.length) L.push("  (aucun)"); v.photos.forEach(p => L.push(`  - ${p.kind==="pdf"?"[PDF] ":""}${p.tag}${p.motif?" — "+p.motif:""}`));

async function ensureProfile(user){
  const ref = doc(db, "users", user.uid);
  const snap = await getDoc(ref);
  if (!snap.exists()){
    // Première connexion : crée le profil. S'il n'y a aucun utilisateur, cette personne est admin.
    let role = "technicien";
    try {
      const existing = await getDocs(collection(db, "users"));
      if (existing.empty) role = "admin";
    } catch {}
    const name = S.pendingName || user.displayName || user.email.split("@")[0];
    S.pendingName = null;
    const data = {email:user.email,name,role,active:true,createdAt:new Date().toISOString()};
    await setDoc(ref, data);
    return data;
  }
  return snap.data();
}

async function compressImage(file){
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res,rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const sc = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas");
    c.width = Math.round(img.naturalWidth * sc); c.height = Math.round(img.naturalHeight * sc);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    return await new Promise(r => c.toBlob(r, "image/jpeg", 0.82));
  } finally { URL.revokeObjectURL(url); }
}

async function uploadPhoto(blob, type, kind, visiteId){
  const id = uid() + "_" + Date.now();
  const ext = kind === "pdf" ? "pdf" : "jpg";
  const path = `photos/${visiteId}/${id}.${ext}`;
  const r = sref(storage, path);
  await uploadBytes(r, blob, {contentType: type});
  const url = await getDownloadURL(r);
  return {id, url, path, tag:S.phTag, motif:S.phMotif||"", kind, at:new Date().toISOString()};
}

  else if (S.isAdmin) mainBtn = st === "devis_fait" ? `<button class="btn ghost" data-act="reopen" style="flex:1">Rouvrir la visite</button>` : `<button class="btn primary" data-act="done">✓ Marquer devis fait</button>`;
  else mainBtn = st === "brouillon" ? `<button class="btn primary" data-act="send">Envoyer au bureau</button>` : `<button class="btn ghost" disabled style="flex:1">${st==="envoye"?"✓ Envoyée au bureau":"✓ Devis fait"}</button>`;
  return `<div class="dock"><div class="dock-in">
    ${S.step>0?`<button class="btn ghost" data-act="prev">←</button>`:""}
    <span class="st ${S.save}"><span class="d"></span>${S.save==="pending"?"Enregistrement…":S.save==="err"?"Non enregistré":"Enregistré"}</span>
    ${mainBtn}
  </div></div>`;
}

/* =====================================================================
   Routing & rendu
   ===================================================================== */
function render(){
  if (!CONFIG_OK) { $("app").innerHTML = pageConfig(); return; }
  if (!S.user) { $("app").innerHTML = pageLogin(S.loginMode || "signin"); return; }

  const parts = (location.hash.slice(1) || "dashboard").split("/");
  const head = parts[0];
  S.route = parts.join("/");

  let html;
  if (head === "dashboard" || head === "") html = pageDashboard();
  else if (head === "visites") html = pageVisites();
  else if (head === "visite") html = pageVisite(parts[1]);
  else if (head === "nouvelle-visite") { createVisiteAndOpen(); return; }
  else if (head === "clients") html = pageClients();
  else if (head === "client") html = pageClient(parts[1]);
  else if (head === "techniciens") html = pageTechniciens();
  else if (head === "parametres") html = pageParametres();
  else html = pageDashboard();

  $("app").innerHTML = `<div class="shell">${html}</div>`;
  if (S.modal) renderModal();
}

window.addEventListener("hashchange", () => {
  if (!location.hash.startsWith("#visite/")) S.v = null;
  render(); window.scrollTo(0,0);
});
addEventListener("online", () => { S.online = true; render(); });
addEventListener("offline", () => { S.online = false; render(); });

   ===================================================================== */
function openModal(cfg){ S.modal = cfg; renderModal(); }
function closeModal(){ S.modal = null; const m = $("modal"); if (m) m.remove(); }
function renderModal(){
  const m = $("modal"); if (m) m.remove();
  if (!S.modal) return;
  const d = document.createElement("div");
  d.id = "modal"; d.className = "modal";
  d.innerHTML = `<div class="modal-box">${S.modal.html}</div>`;
  document.body.appendChild(d);
  d.addEventListener("click", e => { if (e.target === d) closeModal(); });
}

  openModal({html:`<h2>Modifier mon nom</h2>
    <form id="name-form">
      <div class="field"><label for="nm-input">Nom complet</label><input id="nm-input" required maxlength="80" value="${esc(S.profile?.name||"")}"></div>
      <div class="btn-group" style="margin-top:16px"><button type="submit" class="btn primary">Enregistrer</button><button type="button" class="btn ghost" data-closemodal="1">Annuler</button></div>
    </form>`});
}

/* =====================================================================
   Événements globaux
   ===================================================================== */
document.addEventListener("click", async e => {
  // Modale : fermeture
  if (e.target.dataset.closemodal) { closeModal(); return; }
  // Chips rôle dans la modale tech
  if (e.target.dataset.tfrole) {
    S.techForm.role = e.target.dataset.tfrole;
    e.target.parentElement.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c === e.target));
    return;
  }
  // Menu mobile
  if (e.target.closest("#menu-btn")) { S.sbOpen = !S.sbOpen; render(); return; }
  if (e.target.id === "sb-backdrop") { S.sbOpen = false; render(); return; }
  if (e.target.closest(".nav a")) { S.sbOpen = false; setTimeout(() => { const bd = $("sb-backdrop"); if (bd) bd.classList.remove("show"); const sb = $("sidebar"); if (sb) sb.classList.remove("open"); }, 50); return; }
  // Retour
  if (e.target.closest("[data-back]")) { location.hash = e.target.closest("[data-back]").dataset.back; return; }

  // Login
  if (e.target.id === "forgot-btn") { S.loginMode = "reset"; S.loginErr = ""; S.loginOk = ""; render(); return; }
  if (e.target.id === "back-signin") { S.loginMode = "signin"; S.loginErr = ""; S.loginOk = ""; render(); return; }

  // Paramètres
  if (e.target.id === "logout-btn") { await signOut(auth); return; }
  if (e.target.id === "change-pwd-btn") { openChangePwdModal(); return; }
  if (e.target.id === "edit-name-btn") { openEditNameModal(); return; }
  if (e.target.id === "send-reset") {
    try { await sendPasswordResetEmail(auth, S.profile.email); toast("E-mail envoyé.","ok"); closeModal(); }
    catch { toast("Envoi impossible.","err"); } return;
  }

  // Techniciens
  if (e.target.id === "add-tech-btn" || e.target.id === "add-tech-btn-2") { openAddTechModal(); return; }
  if (e.target.dataset.techPwd) {
    try { await sendPasswordResetEmail(auth, e.target.dataset.techPwd); toast("Lien envoyé par e-mail.","ok"); }
    catch { toast("Envoi impossible.","err"); } return;
  }
  if (e.target.dataset.techToggle) {
    const id = e.target.dataset.techToggle, active = e.target.dataset.active === "1";
    try { await updateDoc(doc(db,"users",id),{active}); toast(active?"Technicien réactivé.":"Technicien désactivé.","ok"); }
    catch { toast("Action impossible.","err"); } return;
  }
  if (e.target.dataset.techRole) {
    const id = e.target.dataset.techRole, role = e.target.dataset.role;
    try { await updateDoc(doc(db,"users",id),{role}); toast("Rôle mis à jour.","ok"); }
    catch { toast("Action impossible.","err"); } return;
  }

  // Visites
  if (e.target.closest("[data-vtab]")) { S.visitesTab = e.target.closest("[data-vtab]").dataset.vtab; render(); return; }
  if (e.target.closest("[data-stepnav]")) { goStep(+e.target.closest("[data-stepnav]").dataset.stepnav); return; }
  if (e.target.closest("[data-goto-step]")) { const b = e.target.closest("[data-goto-step]"); goStep(+b.dataset.step, b.dataset.r); return; }
  if (e.target.closest("[data-roomtoggle]")) { const id = e.target.closest("[data-roomtoggle]").dataset.roomtoggle; S.openRoom = S.openRoom===id?null:id; S.confirm=null; render(); return; }
  if (e.target.closest("[data-addroom]")) {
    if (isReadOnly()) return;
    const base = e.target.closest("[data-addroom]").dataset.addroom;
    const same = S.v.pieces.filter(p => p.nom === base || p.nom.startsWith(base+" ")).length;
    const p = {id:uid(),nom:same?`${base} ${same+1}`:base,pose:"",mur:"",hsp:"",postes:{},note:""};
    S.v.pieces.push(p); S.openRoom = p.id; markDirty(); render(); return;
  }
  if (e.target.closest("[data-askdelroom]")) { S.confirm = "room-" + e.target.closest("[data-askdelroom]").dataset.askdelroom; render(); return; }
  if (e.target.closest("[data-delroom]")) { const id = e.target.closest("[data-delroom]").dataset.delroom; S.v.pieces = S.v.pieces.filter(p => p.id !== id); S.confirm=null; S.openRoom=null; markDirty(); render(); return; }
  if (e.target.dataset.cancel) { S.confirm = null; render(); return; }
  if (e.target.dataset.askdel) { S.confirm = "del"; render(); return; }
  if (e.target.dataset.delvisit) { await deleteVisite(); return; }
  if (e.target.closest("[data-delph]")) { await deletePhoto(+e.target.closest("[data-delph]").dataset.delph); return; }

  // Actions
  const act = e.target.closest("[data-act]")?.dataset.act;
  if (!act) return;
  const b = e.target.closest("[data-act]");

  if (act === "next") goStep(S.step+1);
  else if (act === "prev") goStep(S.step-1);
  else if (act === "chip") {
    if (isReadOnly()) return;
    const path = b.dataset.path, v = b.dataset.v;
    if (b.dataset.multi) { const arr = (getP(S.v,path)||[]).slice(); const i = arr.indexOf(v); i>=0?arr.splice(i,1):arr.push(v); setP(S.v,path,arr); }
    else setP(S.v,path, getP(S.v,path)===v?"":v);
    markDirty(); render();
  }
  else if (act === "step") {
    if (isReadOnly()) return;
    const path = b.dataset.path, cur = parseFloat(getP(S.v,path))||0;
    const n = Math.max(0, Math.round((cur + parseInt(b.dataset.d,10))*10)/10);
    setP(S.v,path,n); markDirty(); render();
  }
  else if (act === "phtag") { S.phTag = b.dataset.v; S.phMotif = ""; render(); }
  else if (act === "phmotifchip") { S.phMotif = S.phMotif===b.dataset.v?"":b.dataset.v; render(); }
  else if (act === "retake") { if (S.pending){URL.revokeObjectURL(S.pending.url);S.pending=null} render(); }
  else if (act === "confirmph") { if (S.pending && !S.uploading) await commitPhoto(S.pending.blob, "image/jpeg", "photo"); }
  else if (act === "copy") { try { await navigator.clipboard.writeText(compteRendu(S.v)); toast("Compte rendu copié.","ok"); } catch { toast("Copie bloquée.","err"); } }
  else if (act === "send") await setStatus("envoye", {sentAt:new Date().toISOString()});
  else if (act === "done") await setStatus("devis_fait", {doneAt:new Date().toISOString()});
  else if (act === "reopen") await setStatus("envoye", {});
});

document.addEventListener("input", e => {
  const t = e.target;
  const act = t.dataset.act;
  // Login
  if (t.id === "l-email" || t.id === "l-pass") { S.loginErr = ""; return; }
  // Recherches
  if (t.id === "v-search") { S.visitesQ = t.value; renderListOnly("list"); return; }
  if (t.id === "c-search") { S.clientsQ = t.value; renderListOnly("list"); return; }
  if (t.id === "t-search") { S.techsQ = t.value; renderListOnly("list"); return; }

  if (act === "phmotif") { S.phMotif = t.value.trim(); const sp = document.querySelector('.pick + p b'); return; }

  if (!S.v || isReadOnly()) return;
  if (act === "text") { setP(S.v, t.dataset.path, t.value); markDirty();
    if (t.dataset.path === "client.nom") { const h = document.querySelector(".topbar h1"); if (h) h.textContent = t.value || "Nouvelle visite"; }
    if (t.dataset.path.startsWith("pieces.") && t.dataset.path.endsWith(".nom")) { const h = t.closest(".room")?.querySelector(".room-h .nm"); if (h) h.textContent = t.value || "Pièce"; }
    return;
  }
  if (act === "num") {
    const raw = String(t.value).replace(",",".");
    const n = raw === "" ? (t.dataset.path==="existant.ohms"?"":0) : Math.max(0, parseFloat(raw)||0);
    setP(S.v, t.dataset.path, n); markDirty();
    const row = t.closest(".row-fld"); if (row) row.classList.toggle("on", n > 0);
  }
});

// Soumissions de formulaires
document.addEventListener("submit", async e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === "login-form") await handleLogin();
  else if (f.id === "signup-form") await handleSignup();
  else if (f.id === "reset-form") await handleReset();
  else if (f.id === "tech-form") await handleCreateTech();
  else if (f.id === "name-form") await handleNameUpdate();
});

document.addEventListener("change", async e => {
  const t = e.target;
  if (t.dataset.act !== "shoot" || !t.files || !t.files[0]) return;
  const file = t.files[0];
  if (file.type === "application/pdf" || /\.pdf$/i.test(file.name)) { await commitPhoto(file, "application/pdf", "pdf"); return; }
  try { const blob = await compressImage(file); S.pending = {blob, url: URL.createObjectURL(blob)}; render(); }
  catch { toast("Image illisible.","err"); }
});

/* =====================================================================
   Login handlers
   ===================================================================== */
async function handleLogin(){
  const email = $("l-email").value.trim(), pass = $("l-pass").value;
  S.loginErr = ""; S.loginOk = "";
  const btn = document.querySelector("#login-form button[type=submit]"); btn.disabled = true;
  try { await signInWithEmailAndPassword(auth, email, pass); }
  catch (err) {
    const code = err.code || "";
    S.loginErr = code.includes("invalid-credential") || code.includes("wrong-password") || code.includes("user-not-found") ? "E-mail ou mot de passe incorrect." :
      code.includes("too-many-requests") ? "Trop d'essais. Attendez quelques minutes." :
      code.includes("network") ? "Pas de réseau. Vérifiez la connexion." :
      "Connexion impossible.";
    render();
  } finally { btn.disabled = false; }
}
async function handleSignup(){
  const name = $("s-name").value.trim(), email = $("s-email").value.trim(), pass = $("s-pass").value;
  S.loginErr = ""; S.loginOk = "";
  const btn = document.querySelector("#signup-form button[type=submit]"); btn.disabled = true;
  try {
    await createUserWithEmailAndPassword(auth, email, pass);
    // ensureProfile tournera à la connexion et créera le profil admin si c'est le premier utilisateur
    // On force le nom à ce que l'utilisateur a saisi
    S.pendingName = name;
    location.hash = ""; // nettoie #setup
  }
  catch (err) {
    const code = err.code || "";
    S.loginErr = code.includes("email-already") ? "Cette adresse est déjà utilisée. Essayez « Se connecter »." :
      code.includes("invalid-email") ? "Adresse e-mail invalide." :
      code.includes("weak-password") ? "Mot de passe trop court (8 caractères minimum)." :
      "Création impossible : " + err.message;
    render();
  } finally { btn.disabled = false; }
}
async function handleReset(){
  const email = $("r-email").value.trim();
  try { await sendPasswordResetEmail(auth, email); S.loginOk = "E-mail envoyé. Consultez votre boîte de réception."; S.loginMode = "signin"; render(); }
  catch { S.loginErr = "Envoi impossible. Vérifiez l'adresse."; render(); }
}
async function handleCreateTech(){
  const name = $("tf-name").value.trim(), email = $("tf-email").value.trim(), err = $("tf-err"), btn = $("tf-submit");
  err.classList.add("hidden"); btn.disabled = true;
  try {
    // Crée le compte avec un mot de passe aléatoire via l'instance secondaire
    const pass = randPass();
    const cred = await createUserWithEmailAndPassword(secAuth, email, pass);
    await setDoc(doc(db, "users", cred.user.uid), {email,name,role:S.techForm.role,active:true,createdAt:new Date().toISOString()});
    await sendPasswordResetEmail(auth, email);
    await secAuth.signOut();
    closeModal(); toast("Technicien ajouté. E-mail envoyé.","ok");
  } catch (e) {
    const code = e.code || "";
    err.textContent = code.includes("email-already") ? "Cette adresse e-mail est déjà utilisée." :
                      code.includes("invalid-email") ? "Adresse e-mail invalide." :
                      code.includes("permission") ? "Vous n'avez pas les droits." : "Erreur : " + (e.message || code);
    err.classList.remove("hidden"); btn.disabled = false;
  }
}
async function handleNameUpdate(){
  const name = $("nm-input").value.trim();
  try { await updateDoc(doc(db,"users",S.user.uid),{name}); S.profile.name = name; closeModal(); render(); toast("Nom mis à jour.","ok"); }
  catch { toast("Erreur.","err"); }
}

/* =====================================================================
   Visite : création, sauvegarde, actions
   ===================================================================== */
async function createVisiteAndOpen(){
  if (!S.user) return;
  const now = new Date().toISOString();
  const data = {...blankVisite(), createdBy:S.user.uid, createdAt:now, updatedAt:now};
  try {
    const r = doc(collection(db, "visites"));
    await setDoc(r, data);
    location.hash = "#visite/" + r.id;
  } catch (e) { toast("Création impossible.","err"); location.hash = "#visites"; }
}
function markDirty(){
  if (!S.v || isReadOnly()) return;
  S.v.updatedAt = new Date().toISOString();
  S.save = "pending"; refreshSaveState();
  clearTimeout(saveT); saveT = setTimeout(saveVisite, 800);
}
function refreshSaveState(){
  const el = document.querySelector(".dock-in .st, .topbar .st");
  document.querySelectorAll(".st").forEach(e => {
    e.className = "st " + S.save;
    e.innerHTML = `<span class="d"></span>${S.save==="pending"?"Enregistrement…":S.save==="err"?"Non enregistré":"Enregistré"}`;
  });
}
async function saveVisite(){
  clearTimeout(saveT); saveT = null;
  if (!S.v) return;
  if (saving) { again = true; return; }
  saving = true;
  const v = S.v;
  try {
    await updateDoc(doc(db,"visites",v.id), {
      client:v.client, existant:v.existant, gamme:v.gamme, pieces:v.pieces, photos:v.photos, updatedAt:v.updatedAt
    });
    if (S.v === v) { S.save = "ok"; refreshSaveState(); }
  } catch { if (S.v === v) { S.save = "err"; refreshSaveState(); saveT = setTimeout(saveVisite, 5000); } }
  saving = false;
  if (again) { again = false; saveVisite(); }
}
async function setStatus(status, extra){
  if (saveT || saving) await saveVisite();
  try {
    await updateDoc(doc(db,"visites",S.v.id), {status, ...extra, updatedAt:new Date().toISOString()});
    S.v.status = status; Object.assign(S.v, extra);
    toast(status==="envoye"?"Visite envoyée au bureau.":status==="devis_fait"?"Visite marquée « devis fait ».":"Visite rouverte.","ok");
    render();
  } catch { toast("Pas de réseau.","err"); }
}
function goStep(s, room){
  if (S.pending) { URL.revokeObjectURL(S.pending.url); S.pending = null; }
  S.step = Math.max(0, Math.min(STEPS.length-1, s));
  S.confirm = null;
  if (room) S.openRoom = room;
  render(); window.scrollTo(0,0);
  if (room) { const el = $("rh-"+room); if (el) el.scrollIntoView({block:"start"}); }
}
async function commitPhoto(blob, type, kind){
  S.uploading = true; render();
  try {
    const photo = await uploadPhoto(blob, type, kind, S.v.id);
    S.v.photos.push(photo);
    toast((kind==="pdf"?"Document ajouté : ":"Photo ajoutée : ") + S.phTag,"ok");
    S.phMotif = "";
    if (S.pending) { URL.revokeObjectURL(S.pending.url); S.pending = null; }
    markDirty();
  } catch (e) {
    toast(!navigator.onLine ? "Pas de réseau." : "Envoi impossible.","err");
  }
  S.uploading = false; render();
}
async function deletePhoto(i){
  const p = S.v.photos[i]; if (!p) return;
  S.v.photos.splice(i,1); markDirty(); render();
  try { if (p.path) await deleteObject(sref(storage, p.path)); } catch {}
  toast("Photo supprimée.","ok");
}
async function deleteVisite(){
  const v = S.v; clearTimeout(saveT); saveT = null;
  try {
    for (const p of v.photos) { try { if (p.path) await deleteObject(sref(storage, p.path)); } catch {} }
    await deleteDoc(doc(db,"visites",v.id));
    S.v = null; location.hash = "#visites"; toast("Visite supprimée.","ok");
  } catch { toast("Suppression impossible.","err"); }
}
function renderListOnly(){
  // Rapide : réaffiche juste la liste, sans tout re-render (focus input)
  render();
  const f = document.querySelector(".search"); if (f) f.focus();
}

/* =====================================================================
   Démarrage : auth + subscriptions
   ===================================================================== */
if (!CONFIG_OK) {
  render();
} else {
  onAuthStateChanged(auth, async user => {
    unsubs.forEach(u => u()); unsubs = [];
    if (user) {
      S.user = user;
      try {
        S.profile = await ensureProfile(user);
        S.isAdmin = S.profile.role === "admin";
      } catch (e) {
        $("app").innerHTML = `<div class="screen"><div class="login"><h1>Problème d'accès</h1><p class="err">Impossible de lire votre profil. Vérifiez les règles de sécurité Firestore (voir README).</p><button class="btn ghost" onclick="location.reload()">Recharger</button></div></div>`;
        return;
      }
      subscribeAll(); render();
    } else {
      S.user = null; S.profile = null; S.isAdmin = false; S.visites = []; S.clients = []; S.techs = [];
      S.loginMode = "signin"; render();
    }
  });
}

function subscribeAll(){
  // Visites : si technicien, seulement les siennes OU celles qu'il a créées. Si admin, toutes.
  const qVisites = S.isAdmin ? collection(db,"visites") : query(collection(db,"visites"), where("createdBy","==",S.user.uid));
  unsubs.push(onSnapshot(qVisites, s => {
    S.visites = s.docs.map(d => ({id:d.id, ...d.data()}));
    S.loading.visites = false;
    render();
  }, err => { S.loading.visites = false; render(); }));

  // Techniciens : seulement admin
  if (S.isAdmin) {
    unsubs.push(onSnapshot(collection(db,"users"), s => {
      S.techs = s.docs.map(d => ({id:d.id, ...d.data()}));
      S.loading.techs = false;
      render();
    }, err => { S.loading.techs = false; }));
  }
}
</script>
